<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Hermes — web spike</title>
    <style>
      html, body { background: #111; color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="root" class="scrollbar-dt"></div>
    <!--
      SPIKE HARNESS ONLY. The capability bridge itself is product code and lives
      in /web/bridge — this page only installs it ahead of the renderer entry,
      with the two development overrides a bare `hermes serve` needs:

        devSessionToken   the loopback bind has no cookie session, so REST needs
                         the header and the WS upgrade needs ?token=
        devGatewayOrigin  measured — a Vite preview proxy cannot carry the WS
                         upgrade (opens, then dies 1006), so the socket is dialed
                         straight at the gateway

      Both are empty in production: the bundle is served BY the gateway, the
      session is HttpOnly, and the socket is same-origin. See CAPABILITY-MATRIX.md.

      Module scripts run in document order, so this must stay ahead of main.tsx.
    -->
    <script type="module">
      import { installWebBridge } from '/web/bridge/index.ts'

      const params = new URLSearchParams(location.search)
      installWebBridge({
        devSessionToken: params.get('token') ?? 'spike-token-123',
        devGatewayOrigin: params.get('gateway') ?? 'http://127.0.0.1:9119'
      })
      console.info('[spike] WebBridge installed', window.hermesWeb.capabilities().bridge.length, 'live members')
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
